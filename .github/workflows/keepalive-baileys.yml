name: Keep Render Baileys Bridge Awake

on:
  schedule:
    # Runs every 10 minutes (cron syntax in UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Baileys Bridge Health Endpoint
        run: |
          curl -s -f -m 15 https://devunomietapf.onrender.com/health || echo "Ping failed or timed out"
